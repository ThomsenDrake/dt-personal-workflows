[project]
name = "epub-voxtral-audiobook-worker"
version = "0.1.0"
description = "Mistral Workflows worker for the epub-to-audiobook pipeline: parses an .epub from Google Drive, scans the whole book for characters, casts distinct Voxtral voices, synthesizes per-chapter MP3s, and uploads the audiobook package back to Drive"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=4.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
